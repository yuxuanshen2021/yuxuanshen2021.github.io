<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcelona | Yuxuan's Birding Journal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f0e6;
      color: #29332b;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 6%;
      border-bottom: 1px solid #bdc3b7;
    }

    .logo {
      color: #29332b;
      font-family: Georgia, serif;
      font-size: 30px;
      text-decoration: none;
    }

    nav a {
      margin-left: 28px;
      color: #29332b;
      text-decoration: none;
    }

    nav a:hover {
      color: #a85d3b;
    }

    .hero {
      padding: 90px 6% 70px;
    }

    .label {
      color: #a85d3b;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0;
      font-family: Georgia, serif;
      font-size: 68px;
      font-weight: normal;
    }

    .intro {
      max-width: 650px;
      color: #657064;
      font-size: 18px;
      line-height: 1.7;
    }

    .species {
      padding: 70px 6% 110px;
      background: #354739;
      color: #f4f0e6;
    }

    h2 {
      margin: 10px 0 45px;
      font-family: Georgia, serif;
      font-size: 46px;
      font-weight: normal;
    }

    .bird-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .bird-card {
      display: block;
      overflow: hidden;
      border: 1px solid #839183;
      color: inherit;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .bird-card:hover {
      transform: translateY(-5px);
    }

    .bird-card img {
      display: block;
      width: 100%;
      height: 310px;
      object-fit: cover;
    }

    .bird-info {
      padding: 25px;
    }

    .bird-info h3 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-size: 27px;
      font-weight: normal;
    }

    .scientific-name {
      margin: 0;
      color: #dba385;
      font-family: Georgia, serif;
      font-style: italic;
    }

    footer {
      display: flex;
      justify-content: space-between;
      padding: 30px 6%;
      background: #27362b;
      color: white;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .bird-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        gap: 18px;
      }

      nav a {
        margin: 0 20px 0 0;
      }

      h1 {
        font-size: 52px;
      }

      .bird-grid {
        grid-template-columns: 1fr;
      }

      footer {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="../index.html">Yuxuan's Birding Journal</a>

    <nav>
      <a href="../index.html">Home</a>
      <a href="spain.html">Spain</a>
      <a href="../index.html#regions">Regions</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="label">Spain · Birding by place</div>
      <h1>Barcelona</h1>

      <p class="intro">
        Birds encountered in Barcelona's parks, wetlands, coastline,
        and everyday urban green spaces.
      </p>
    </section>

    <section class="species">
      <div class="label">Species observed</div>
      <h2>Birds of Barcelona</h2>

      <div class="bird-grid">
        <a class="bird-card" href="../birds/grey-heron.html">
          <img
            src="../images/cover.jpg"
            alt="Grey Heron photographed at Diagonal Mar Park"
          >

          <div class="bird-info">
            <h3>Grey Heron</h3>
            <p class="scientific-name">Ardea cinerea</p>
          </div>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <span>Yuxuan's Birding Journal</span>
    <span>Barcelona · Spain</span>
  </footer>
</body>
</html>
